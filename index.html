
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonus Ball</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f1f3f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bonus Ball" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #f1f3f7;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #14161c;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      /* Drifting balls on the sign-in screen. CSS only, so they cost nothing while idle. */
      .login-ball {
        position: absolute;
        opacity: 0.35;
        animation: loginDrift 9s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes loginDrift {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-14px, 18px) rotate(25deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .login-ball { animation: none; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
