[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev -- --port 3000"
  targetPort = 3000
  port = 8888
  functions = "netlify/functions"
  
[[scheduled.functions]]
  name = "push-reminders"
  schedule = "*/1 * * * *"

# Proactive payment + draw-day reminders. Function itself bails on non-target days.
[[scheduled.functions]]
  name = "weekly-reminders"
  schedule = "0 9 * * 4,6"
